services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vigil-postgres
    restart: always
    environment:
      POSTGRES_DB: vigil_prod
      POSTGRES_USER: vigil_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - vigil_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vigil-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - vigil_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB Time Series
  influxdb:
    image: influxdb:2.7
    container_name: vigil-influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: vigil-org
      DOCKER_INFLUXDB_INIT_BUCKET: vigil-telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    networks:
      - vigil_network

  # VigilOS Server
  server:
    build:
      context: ./vigil-server
      dockerfile: Dockerfile
    container_name: vigil-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vigil_prod
      DB_USER: vigil_admin
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./vigil-server:/app
      - /app/node_modules
    ports:
      - "4141:3000"
    networks:
      - vigil_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_started

  # VigilOS Frontend
  frontend:
    build:
      context: ./vigil-app
      dockerfile: Dockerfile
    container_name: vigil-frontend
    restart: always
    ports:
      - "8181:80"
    networks:
      - vigil_network
    depends_on:
      - server

  # MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: vigil-mosquitto
    restart: always
    command: mosquitto -c /dev/null -p 1883
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - vigil_network

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:

networks:
  vigil_network:
    driver: bridge
