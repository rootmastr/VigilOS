# ═══════════════════════════════════════════════════════════════════════════════
# VigilOS V3 — NGINX Configuration
# Multi-Layer Traffic Control (PRD §2.3)
# ═══════════════════════════════════════════════════════════════════════════════

# Rate Limiting Zones (L4/L7)
# Global: 100 requests/sec per IP (DDoS protection)
limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

# Per-tenant: Extract tenant from X-Tenant-ID header or JWT subdomain
map $http_x_tenant_id $tenant_key {
    default $binary_remote_addr;
    ~.+    $http_x_tenant_id;
}
limit_req_zone $tenant_key zone=tenant_api:10m rate=1000r/m;

# Login: 5 requests per minute per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Telemetry: 20 requests per minute per device
limit_req_zone $binary_remote_addr zone=telemetry:10m rate=20r/m;

# Connection limiting (L4)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost;

    # ═══════════════════════════════════════════════════════════════════════════
    # SECURITY HEADERS
    # ═══════════════════════════════════════════════════════════════════════════

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ═══════════════════════════════════════════════════════════════════════════
    # GZIP COMPRESSION
    # ═══════════════════════════════════════════════════════════════════════════

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ═══════════════════════════════════════════════════════════════════════════
    # REQUEST BODY SIZE LIMIT
    # ═══════════════════════════════════════════════════════════════════════════

    client_max_body_size 10M;

    # ═══════════════════════════════════════════════════════════════════════════
    # CONNECTION LIMITING (L4)
    # ═══════════════════════════════════════════════════════════════════════════

    limit_conn conn_limit 50;

    # ═══════════════════════════════════════════════════════════════════════════
    # FRONTEND STATIC FILES
    # ═══════════════════════════════════════════════════════════════════════════

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # API PROXY — Global Rate Limiting + Per-Tenant Quota
    # ═══════════════════════════════════════════════════════════════════════════

    location /api/ {
        # CORS — handle preflight + response headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Device-Token, X-Tenant-ID';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Device-Token, X-Tenant-ID' always;

        # Global rate limit (L7) - 100 req/s per IP
        limit_req zone=global burst=200 nodelay;
        limit_req_status 429;

        # Per-tenant rate limit - 1000 req/min per tenant
        limit_req zone=tenant_api burst=100 nodelay;

        # Pass rate limit headers to backend
        limit_req_status 429;

        # Proxy settings
        proxy_pass http://vigil-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;

        # Custom error page for rate limiting
        error_page 429 = @rate_limit_error;
    }

    # Rate limit error response
    location @rate_limit_error {
        default_type application/json;
        return 429 '{"success":false,"error":"Rate limit exceeded","message":"Too many requests. Please try again later."}';
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # LOGIN ENDPOINT — Stricter Rate Limiting
    # ═══════════════════════════════════════════════════════════════════════════

    location /api/v1/auth/login {
        # CORS — handle preflight + response headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Device-Token, X-Tenant-ID';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Device-Token, X-Tenant-ID' always;

        # Strict rate limit - 5 req/min per IP (brute-force protection)
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://vigil-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        error_page 429 = @login_rate_limit_error;
    }

    location @login_rate_limit_error {
        default_type application/json;
        return 429 '{"success":false,"error":"Too many login attempts","message":"Account locked. Please try again in 5 minutes."}';
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # TELEMETRY ENDPOINT — Device Rate Limiting
    # ═══════════════════════════════════════════════════════════════════════════

    location /api/v1/telemetry/ingest {
        # CORS — handle preflight + response headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Device-Token, X-Tenant-ID';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Device-Token, X-Tenant-ID' always;

        # Device rate limit - 20 req/min per device
        limit_req zone=telemetry burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://vigil-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Device-Token $http_x_device_token;

        error_page 429 = @telemetry_rate_limit_error;
    }

    location @telemetry_rate_limit_error {
        default_type application/json;
        return 429 '{"success":false,"error":"Device rate limit exceeded","message":"Maximum 20 telemetry packets per minute."}';
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # SOCKET.IO PROXY (Legacy Real-time Layer)
    # ═══════════════════════════════════════════════════════════════════════════

    location /socket.io/ {
        proxy_pass http://vigil-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # WEBSOCKET PROXY
    # ═══════════════════════════════════════════════════════════════════════════

    location /ws/ {
        proxy_pass http://vigil-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
        proxy_send_timeout 90;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # CACHE STATIC ASSETS
    # ═══════════════════════════════════════════════════════════════════════════

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # BLOCK SUSPICIOUS REQUESTS
    # ═══════════════════════════════════════════════════════════════════════════

    # Block common attack patterns
    location ~* (\.env|\.git|\.svn|\.htaccess|\.htpasswd) {
        deny all;
        return 404;
    }

    # Block PHP files (not used in Node.js app)
    location ~* \.php$ {
        deny all;
        return 404;
    }

    # Block XML-RPC (common WordPress attack vector)
    location = /xmlrpc.php {
        deny all;
        return 404;
    }
}
